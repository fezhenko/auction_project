server:
  port: 8080

spring:
  jackson:
    datatype:
      datetime:
        # Jackson 3 writes a zero UTC offset as "Z". Keep the "+00:00" that the API and the services' JSON use.
        write-utc-as-offset: true
  cloud:
    openfeign:
      client:
        config:
          domain:
            connectTimeout: 5000
            readTimeout: 3000

jwt:
  # Empty when JWT_SECRET is unset, so JwtProperties can fail startup with its own message.
  secret: ${JWT_SECRET:}

services:
  auction-service:
    url: 'http://localhost:8081'
  users-service:
    url: 'http://localhost:8082'
