spring:
  jackson:
    datatype:
      datetime:
        # Jackson 3 writes a zero UTC offset as "Z". Keep the "+00:00" that the API and the services' JSON use.
        write-utc-as-offset: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:15432/postgres
    username: postgres
    password: postgres
  cloud:
    openfeign:
      client:
        config:
          domain:
            connectTimeout: 5000
            readTimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: '*'

server:
  port: 8082

services:
  exchange-service:
    url: 'https://api.apilayer.com/exchangerates_data'
    api-key: ${EXCHANGE_API_KEY}