spring:
  jackson:
    datatype:
      datetime:
        # Jackson 3 writes a zero UTC offset as "Z". Keep the "+00:00" that the API and the services' JSON use.
        write-utc-as-offset: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:15433/postgres
    username: postgres
    password: postgres
  cloud:
    openfeign:
      client:
        config:
          domain:
            connectTimeout: 5000
            readTimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: '*'

server:
  port: 8081

custom:
  scheduler:
    zone: "ECT"
    start-auction-cron: "3 * * * * 0-6"
    finish-auction-cron: "4 * * * * 0-6"
    update-balance-cron: "*/60 * * * * 0-7"

services:
  users-service:
    url: 'http://localhost:8082'
