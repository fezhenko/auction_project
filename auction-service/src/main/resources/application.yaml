spring:
  jackson:
    datatype:
      datetime:
        # Jackson 3 writes a zero UTC offset as "Z". Keep the "+00:00" that the API and the services' JSON use.
        write-utc-as-offset: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:15433/postgres
    username: postgres
    password: postgres
  cloud:
    openfeign:
      client:
        config:
          domain:
            connectTimeout: 5000
            readTimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
      # Boot 4 turns the liveness and readiness probes on; the healthchecks use /actuator/health alone.
      probes:
        enabled: false

server:
  port: 8081

auction:
  # How long an auction runs after its start time before it can finish (ISO-8601). Defaults to PT6H when unset.
  # duration: PT6H
  scheduler:
    start-cron: "3 * * * * 0-6"
    finish-cron: "4 * * * * 0-6"
    zone: UTC

custom:
  scheduler:
    # Only the balance job still reads custom.scheduler; settlement-consumer deletes the job and this key.
    update-balance-cron: "*/60 * * * * 0-7"

services:
  users-service:
    url: 'http://localhost:8082'
